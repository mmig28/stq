<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranger Things Trivia Quest 🚲 Upside Down Edition</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0b12;
      --card-bg: #161625;
      --accent-red: #e50914;
      --glow-red: #ff333d;
      --text-light: #f5f5f7;
      --text-muted: #a1a1b5;
      --border-color: #2a2a40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(229, 9, 20, 0.2), 0 0 15px rgba(0, 0, 0, 0.8);
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.6rem;
      text-align: center;
      color: var(--accent-red);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background-color: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff0000, #ff5555);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background-color: #202035;
      border: 2px solid var(--border-color);
      color: var(--text-light);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      border-color: var(--accent-red);
      background-color: #282845;
    }

    .option-btn.selected {
      border-color: var(--accent-red);
      background-color: rgba(229, 9, 20, 0.2);
    }

    .text-input {
      width: 100%;
      padding: 14px 16px;
      background-color: #202035;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-light);
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
    }

    .text-input:focus {
      border-color: var(--accent-red);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--accent-red);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .feedback {
      margin-top: 12px;
      text-align: center;
      font-weight: bold;
      min-height: 24px;
    }

    .feedback.error {
      color: #ff4d4d;
    }

    .restart-btn {
      margin-top: 16px;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Stranger Things</h1>
    <div class="subtitle">Trivia Quest 🚲 Upside Down Edition</div>
    
    <div class="progress-bar">
      <div id="progress" class="progress-fill"></div>
    </div>

    <div id="quiz-card">
      <div id="question-text" class="question-title">Loading...</div>
      <div id="input-area"></div>
      <button id="submit-btn" class="btn-submit" onclick="checkAnswer()">Submit Answer</button>
      <div id="feedback" class="feedback"></div>
      <button class="restart-btn" onclick="resetQuiz()">Restart Quiz</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        type: "mc",
        question: "1. What fictional Indiana town is the show set in?",
        options: ["A) Hawkins", "B) Castle Rock", "C) Riverdale", "D) Derry"],
        answer: "A) Hawkins"
      },
      {
        type: "text",
        question: "2. What is Eleven’s birth name?",
        answers: ["jane", "jane ives", "jane hopper"]
      },
      {
        type: "text",
        question: "3. What food is Eleven obsessed with in Season 1?",
        answers: ["eggo", "eggos", "eggo waffle", "eggo waffles", "waffles"]
      },
      {
        type: "text",
        question: "4. What alternate dimension parallel to Hawkins exists underneath?",
        answers: ["upside down", "the upside down"]
      },
      {
        type: "text",
        question: "5. What tabletop role-playing game do the boys play in Mike's basement?",
        answers: ["dungeons and dragons", "dungeons & dragons", "d&d", "dnd"]
      },
      {
        type: "mc",
        question: "6. What household items does Joyce use to talk to Will in Season 1?",
        options: ["A) Walkie-talkies", "B) Christmas lights", "C) Landline telephones", "D) Flashlights"],
        answer: "B) Christmas lights"
      },
      {
        type: "mc",
        question: "7. What is the name of the ice cream parlor where Steve and Robin work in Season 3?",
        options: ["A) Surfer Boy Pizza", "B) Scoops Ahoy", "C) Starcourt Sweets", "D) Benny's Burgers"],
        answer: "B) Scoops Ahoy"
      },
      {
        type: "mc",
        question: "8. What song saves Max from Vecna in Season 4?",
        options: ["A) Running Up That Hill", "B) Master of Puppets", "C) Should I Stay or Should I Go", "D) Never Ending Story"],
        answer: "A) Running Up That Hill"
      },
      {
        type: "text",
        question: "9. What is the name of Eddie Munson’s D&D club at Hawkins High?",
        answers: ["hellfire club", "the hellfire club"]
      },
      {
        type: "mc",
        question: "10. What was Vecna’s human identity before he went to the Upside Down?",
        options: ["A) Billy Hargrove", "B) Martin Brenner", "C) Henry Creel", "D) Bob Newby"],
        answer: "C) Henry Creel"
      }
    ];

    let currentStage = parseInt(localStorage.getItem("st_quiz_stage")) || 0;
    let selectedOption = null;

    function renderQuestion() {
      const feedbackEl = document.getElementById("feedback");
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";

      if (currentStage >= questions.length) {
        showCompletionScreen();
        return;
      }

      // Update Progress Bar
      const progressPercent = (currentStage / questions.length) * 100;
      document.getElementById("progress").style.width = progressPercent + "%";

      const q = questions[currentStage];
      document.getElementById("question-text").textContent = q.question;

      const inputArea = document.getElementById("input-area");
      inputArea.innerHTML = "";
      selectedOption = null;

      if (q.type === "mc") {
        const container = document.createElement("div");
        container.className = "options-container";

        q.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = opt;
          btn.onclick = () => {
            document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedOption = opt;
          };
          container.appendChild(btn);
        });

        inputArea.appendChild(container);
      } else {
        const input = document.createElement("input");
        input.type = "text";
        input.id = "text-answer";
        input.className = "text-input";
        input.placeholder = "Type your answer here...";
        input.onkeypress = (e) => {
          if (e.key === "Enter") checkAnswer();
        };
        inputArea.appendChild(input);
      }
    }

    function checkAnswer() {
      const q = questions[currentStage];
      const feedbackEl = document.getElementById("feedback");
      let isCorrect = false;

      if (q.type === "mc") {
        if (!selectedOption) {
          feedbackEl.textContent = "Please select an answer!";
          feedbackEl.className = "feedback error";
          return;
        }
        if (selectedOption === q.answer) {
          isCorrect = true;
        }
      } else {
        const inputVal = document.getElementById("text-answer").value.trim().toLowerCase();
        if (!inputVal) {
          feedbackEl.textContent = "Please type an answer!";
          feedbackEl.className = "feedback error";
          return;
        }
        isCorrect = q.answers.some(ans => inputVal.includes(ans) || ans.includes(inputVal));
      }

      if (isCorrect) {
        currentStage++;
        localStorage.setItem("st_quiz_stage", currentStage);
        renderQuestion();
      } else {
        feedbackEl.textContent = "Wrong answer! Try again.";
        feedbackEl.className = "feedback error";
      }
    }

    function showCompletionScreen() {
      document.getElementById("progress").style.width = "100%";
      const quizCard = document.getElementById("quiz-card");
      
      quizCard.innerHTML = `
        <h2 style="text-align: center; color: var(--accent-red); margin-bottom: 12px; font-size: 1.5rem;">🎉 YOU SURVIVED THE UPSIDE DOWN! 🎉</h2>
        <p style="text-align: center; color: var(--text-light); line-height: 1.5; margin-bottom: 20px;">
          Mastery Level: <strong>Hawkins Hero 🚲</strong><br><br>
          You passed all 10 Stranger Things trivia challenges!
        </p>
        <button class="btn-submit" onclick="resetQuiz()">Play Again</button>
      `;

      // Trigger Confetti
      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    function resetQuiz() {
      localStorage.removeItem("st_quiz_stage");
      currentStage = 0;
      location.reload();
    }

    // Initialize
    renderQuestion();
  </script>
</body>
</html>
